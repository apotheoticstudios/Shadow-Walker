
#Apotheotic's Shadow Walker stealth and sneak attack settings
[stealth]
	#Set to false to completely disable stealth awareness, stealth targeting suppression, and sneak attacks.
	enableStealthSystem = true
	#Render the stealth awareness indicator over the vanilla crosshair while sneaking.
	showStealthCrosshair = true
	#Show a short chat message when a sneak attack multiplier applies.
	showSneakAttackMessage = true
	#Maximum range mobs can use for stealth awareness scans.
	#Range: 4.0 ~ 128.0
	maxScanRange = 36.0
	#Global sneak proficiency from 0 to 100. Higher values make players harder to detect without requiring a skill tree.
	#Range: 0.0 ~ 100.0
	sneakLevel = 0.0
	#Multiplier applied to armor noise while sneaking.
	#Range: 0.0 ~ 10.0
	armorNoiseMultiplier = 1.0
	#Fallback melee sneak attack damage multiplier.
	#Range: 1.0 ~ 100.0
	meleeSneakAttackMultiplier = 2.0
	#Sneak attack multiplier for common one-handed melee weapons such as swords, axes, and tridents.
	#Range: 1.0 ~ 100.0
	oneHandedSneakAttackMultiplier = 6.0
	#Sneak attack multiplier for items whose registry path contains 'dagger'.
	#Range: 1.0 ~ 100.0
	daggerSneakAttackMultiplier = 15.0
	#Sneak attack multiplier for projectile damage caused by the player.
	#Range: 1.0 ~ 100.0
	rangedSneakAttackMultiplier = 3.0
	#Maximum range at which detected mobs can change the stealth crosshair. This only affects the visual indicator.
	#Range: 0.0 ~ 128.0
	crosshairDetectionRange = 24.0
	#Remove the vanilla invisibility effect from players after they damage another entity.
	removeInvisibilityOnAttack = true
	#Movement multiplier for idle hostile mobs while they are observing nearby sneaking players. 0 stops wandering, 1 keeps vanilla movement.
	#Range: 0.0 ~ 1.0
	observerMobMovementMultiplier = 0.35

